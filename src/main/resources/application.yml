server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      jakarta.persistence.schema-generation.database.action: none

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-string}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 1 day
